<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc">
  <title id="title">Kotoba Note — Japanese paper dictation</title>
  <desc id="desc">A cream and forest green notebook illustration with headphones, Japanese lettering, and a page of notes.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#326e60" opacity=".12"/></pattern>
